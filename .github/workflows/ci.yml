name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository builds nothing (E15): the executable half — the Lua VM, the
# SDK bindings and the param pipeline — lives in the engine repository, and
# what is published here is the surface a mod author writes against. So CI
# checks the two things that can still go wrong: an example that would no
# longer load, and a generator whose committed output has drifted from its
# input.

jobs:
  # Every example must be a well-formed Lua chunk. This is weaker than the
  # engine's `dev check` — which loads each one through the real sandbox and
  # manifest rules — but it needs no engine build, and it catches the mistake
  # that actually happens when editing published examples: a syntax error.
  # The engine additionally asserts that its copy of these files is
  # byte-identical to this one (`ermod-engine dev check --examples`).
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Every example parses
        run: |
          status=0
          for f in examples/*.lua; do
            if luac5.4 -p "$f" 2>/dev/null || luac -p "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status

  paramdefs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The generator turns the Paramdex XML here into the engine's field
      # tables. Its output is committed in the engine repository, so this
      # cannot diff against a checked-in file; what it can prove is that the
      # generator still runs against this XML and produces something. A
      # change here that breaks it would otherwise surface only at the next
      # engine build.
      - name: The paramdef generator still runs against the committed XML
        run: |
          python3 tools/gen_paramdef.py paramdefs /tmp/paramdefs.zig \
            CharaInitParam ItemLotParam EquipParamWeapon EquipParamProtector EquipParamGoods
          test -s /tmp/paramdefs.zig
