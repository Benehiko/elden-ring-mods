name: CI

on:
  push:
    branches: [main]
  pull_request:

# This repository builds nothing (E15): the executable half, the Lua VM, the
# SDK bindings and the param pipeline, lives in the engine repository, and
# what is published here is the surface a mod author writes against. So CI
# checks the two things that can still go wrong: an example that would no
# longer load, and tooling creeping back in.

jobs:
  # Every example must be a well-formed Lua chunk. This is weaker than
  # `ermod-engine mod check`, which loads each one through the real sandbox and
  # manifest rules, but it needs no engine build, and it catches the mistake
  # that actually happens when editing published examples: a syntax error.
  # The engine additionally asserts that its copy of these files is
  # byte-identical to this one (`zig build test-examples` in the engine).
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.4

      - name: Every example parses
        run: |
          status=0
          for f in examples/*.lua; do
            if luac5.4 -p "$f" 2>/dev/null || luac -p "$f" 2>/dev/null; then
              echo "ok   $f"
            else
              echo "FAIL $f"
              status=1
            fi
          done
          exit $status

  # Every Markdown file is formatted with Prettier (.prettierrc.json).
  # `make fmt` fixes it locally. Prettier comes from the flake, so CI and
  # `nix develop` run the same version (flake.lock).
  markdown-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      - name: Markdown is formatted
        run: nix develop --command make check-fmt

  # This repository publishes no tooling (AGENTS.md): anything that only the
  # engine's maintainers run belongs in the engine. A Python file has been
  # added here before, after the rule existed, so the rule is enforced.
  no-tooling:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No Python, no tools/
        run: |
          found=$(git ls-files '*.py' 'tools/*')
          if [ -n "$found" ]; then
            echo "Not allowed in this repository (see AGENTS.md):"
            echo "$found"
            exit 1
          fi
