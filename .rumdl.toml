# Markdown lint and format: `make fmt` / `make check-fmt`, rumdl from the flake.

[global]
# docs/cli.md is generated by the engine (`make cli-docs` there).
exclude = ["docs/cli.md"]
disable = [
  "MD013", # line length: prose is wrapped by hand, tables and links run long
  "MD036", # bold lead-ins such as "**What works**" are intentional
]

[MD060]
enabled = true
style = "aligned"
